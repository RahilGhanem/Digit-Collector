<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Drawing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            text-align: center;
            color: #ff9500;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .digit-prompt {
            font-size: 120px;
            font-weight: bold;
            color: #ff9500;
            margin-bottom: 30px;
            font-family: 'Arial Black', 'Arial', sans-serif;
            letter-spacing: 10px;
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        canvas {
            border: 4px solid #ff9500;
            border-radius: 12px;
            cursor: crosshair;
            touch-action: none;
            background: white;
            box-shadow: 0 4px 20px rgba(255, 149, 0, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            border: 2px solid #ff9500;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .clear-btn {
            background: transparent;
            color: #ff9500;
        }

        .clear-btn:hover {
            background: #ff9500;
            color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
        }

        .submit-btn {
            background: #ff9500;
            color: #1a1a1a;
        }

        .submit-btn:hover {
            background: transparent;
            color: #ff9500;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Draw the Digit</h1>
        <div class="digit-prompt" id="digitPrompt">0</div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="400" height="400"></canvas>
        </div>

        <div class="button-group">
            <button class="clear-btn" id="clearBtn">Clear</button>
            <button class="submit-btn" id="submitBtn">Submit</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Server configuration
        const SERVER_URL = 'http://localhost:3000';

        // State
        let isDrawing = false;
        let hasDrawn = false;
        let currentDigit = 0;
        let penSize = 5;
        const sessionId = 'participant_' + Math.random().toString(36).substr(2, 9);

        // Sound effects
        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                
                if (type === 'clear') {
                    // Clear sound - ascending beep
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'draw') {
                    // Draw sound - short tick
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'submit') {
                    // Submit sound - success melody
                    const notes = [523, 659, 784]; // C5, E5, G5
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0, now + idx * 0.1 + 0.15);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.15);
                    });
                } else if (type === 'click') {
                    // Click sound - short beep
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            } catch (e) {
                // Ignore audio context errors
            }
        }

        // Initialize canvas with black background
        function initCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = penSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        initCanvas();

        // Show a new random digit
        function showNewDigit() {
            currentDigit = Math.floor(Math.random() * 10);
            document.getElementById('digitPrompt').textContent = currentDigit;
            
            // Randomly change pen size (between 2 and 12)
            const sizes = [2, 3, 4, 5, 6, 8, 10, 12];
            penSize = sizes[Math.floor(Math.random() * sizes.length)];
            
            initCanvas();
            hasDrawn = false;
        }

        // Drawing functions
        function startDrawing(e) {
            isDrawing = true;
            hasDrawn = true;
            playSound('draw');
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Mouse & touch events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDrawing);

        // Button handlers
        document.getElementById('clearBtn').addEventListener('click', () => {
            playSound('clear');
            initCanvas();
            hasDrawn = false;
        });

        document.getElementById('submitBtn').addEventListener('click', async () => {
            if (!hasDrawn) {
                alert('Please draw something before submitting!');
                return;
            }

            playSound('click');

            const filename = `${sessionId}_digit_${currentDigit}_${Date.now()}.png`;

            canvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('image', blob, filename);
                fd.append('participantId', sessionId);
                fd.append('digit', currentDigit);
                fd.append('scoreDelta', 1);

                try {
                    const res = await fetch(SERVER_URL + '/upload', { method: 'POST', body: fd });
                    if (res.ok) {
                        playSound('submit');
                        console.log('Image uploaded successfully');
                    }
                } catch (err) {
                    console.log('Server unreachable, but drawing saved locally');
                }

                // Show next digit after a short delay
                setTimeout(() => {
                    showNewDigit();
                }, 500);
            }, 'image/png');
        });

        // Initialize with first digit
        showNewDigit();
    </script>
</body>
</html>
